<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Second Brain Starter</title>
  <desc id="d">A Monday chat writes to a Markdown folder, and a Friday chat reads it and already knows the project.</desc>
  <rect x="1" y="1" width="1198" height="398" rx="16" fill="#0E0E10" stroke="#26262A" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#71717A">FREE  ·  MIT  ·  PLAIN MARKDOWN</text>
    <rect x="64" y="92" width="56" height="3" fill="#3BA9AE"/>
    <text x="64" y="170" font-size="62" font-weight="700" fill="#FAFAF8">Second Brain Starter</text>
    <text x="64" y="220" font-size="28" fill="#FAFAF8">A memory your AI can continue.</text>
    <text x="64" y="256" font-size="19" fill="#71717A">Facts, decisions and next steps, kept as files you own.</text>
    <rect x="64" y="298" width="400" height="58" rx="10" fill="#161618" stroke="#26262A" stroke-width="2"/>
    <text x="88" y="335" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#3BA9AE">&gt; Set this up for me_</text>

    <rect x="720" y="52" width="392" height="80" rx="12" fill="#161618" stroke="#26262A" stroke-width="2"/>
    <text x="746" y="86" font-size="14" letter-spacing="1.5" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">MONDAY CHAT</text>
    <text x="746" y="115" font-size="20" fill="#FAFAF8">You decide, build, write it down</text>

    <path d="M916 132 V170" stroke="#3BA9AE" stroke-width="2" fill="none"/>
    <path d="M910 162 L916 172 L922 162" stroke="#3BA9AE" stroke-width="2" fill="none"/>

    <rect x="720" y="172" width="392" height="80" rx="12" fill="#0E0E10" stroke="#3BA9AE" stroke-width="2"/>
    <text x="746" y="206" font-size="14" letter-spacing="1.5" fill="#3BA9AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">YOUR FOLDER</text>
    <text x="746" y="235" font-size="20" fill="#FAFAF8">Home.md, 01-Projects, 05-Daily</text>

    <path d="M916 252 V290" stroke="#3BA9AE" stroke-width="2" fill="none"/>
    <path d="M910 282 L916 292 L922 282" stroke="#3BA9AE" stroke-width="2" fill="none"/>

    <rect x="720" y="292" width="392" height="80" rx="12" fill="#161618" stroke="#26262A" stroke-width="2"/>
    <text x="746" y="326" font-size="14" letter-spacing="1.5" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FRIDAY CHAT</text>
    <text x="746" y="355" font-size="20" fill="#FAFAF8">Reads it first. Already knows.</text>
  </g>
</svg>
