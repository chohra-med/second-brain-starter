<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">What the workspace looks like</title>
  <desc id="d">Home.md on top, then six numbered folders: Meta, Projects, Areas, Resources, Archives and Daily. Each record has one home.</desc>
  <rect x="1" y="1" width="1198" height="418" rx="16" fill="#0E0E10" stroke="#26262A" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="48" y="36" width="620" height="52" rx="10" fill="#0E0E10" stroke="#3BA9AE" stroke-width="2"/>
    <text x="72" y="69" font-size="20" font-weight="600" fill="#3BA9AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Home.md</text>
    <text x="220" y="69" font-size="17" fill="#FAFAF8">the page your AI reads first</text>

    <g font-size="20">
      <rect x="48" y="104" width="620" height="44" rx="8" fill="#161618" stroke="#26262A" stroke-width="2"/>
      <text x="72" y="133" fill="#FAFAF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">00-Meta</text>
      <text x="260" y="133" fill="#71717A" font-size="17">rules for where things go</text>

      <rect x="48" y="156" width="620" height="44" rx="8" fill="#161618" stroke="#26262A" stroke-width="2"/>
      <text x="72" y="185" fill="#FAFAF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">01-Projects</text>
      <text x="260" y="185" fill="#71717A" font-size="17">one folder per project</text>

      <rect x="48" y="208" width="620" height="44" rx="8" fill="#161618" stroke="#26262A" stroke-width="2"/>
      <text x="72" y="237" fill="#FAFAF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">02-Areas</text>
      <text x="260" y="237" fill="#71717A" font-size="17">ongoing parts of your work</text>

      <rect x="48" y="260" width="620" height="44" rx="8" fill="#161618" stroke="#26262A" stroke-width="2"/>
      <text x="72" y="289" fill="#FAFAF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">03-Resources</text>
      <text x="260" y="289" fill="#71717A" font-size="17">skills and step-by-step procedures</text>

      <rect x="48" y="312" width="620" height="44" rx="8" fill="#161618" stroke="#26262A" stroke-width="2"/>
      <text x="72" y="341" fill="#FAFAF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">04-Archives</text>
      <text x="260" y="341" fill="#71717A" font-size="17">finished work, moved not deleted</text>

      <rect x="48" y="364" width="620" height="44" rx="8" fill="#161618" stroke="#26262A" stroke-width="2"/>
      <text x="72" y="393" fill="#FAFAF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">05-Daily</text>
      <text x="260" y="393" fill="#71717A" font-size="17">one note per day</text>
    </g>

    <text x="740" y="84" font-size="14" letter-spacing="1.5" fill="#3BA9AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">THE RULE</text>
    <text x="740" y="136" font-size="34" font-weight="700" fill="#FAFAF8">Each record</text>
    <text x="740" y="178" font-size="34" font-weight="700" fill="#FAFAF8">has one home.</text>
    <rect x="740" y="198" width="56" height="3" fill="#3BA9AE"/>
    <text x="740" y="248" font-size="19" fill="#71717A">A new chat reads Home.md,</text>
    <text x="740" y="278" font-size="19" fill="#71717A">finds the right folder</text>
    <text x="740" y="308" font-size="19" fill="#71717A">and carries on.</text>
    <text x="740" y="368" font-size="17" fill="#71717A">Plain Markdown. No app, no account,</text>
    <text x="740" y="394" font-size="17" fill="#71717A">no lock-in.</text>
  </g>
</svg>
